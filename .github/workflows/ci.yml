name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: handwerks
          POSTGRES_PASSWORD: handwerks
          POSTGRES_DB: handwerks
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U handwerks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql://handwerks:handwerks@127.0.0.1:5432/handwerks?serverVersion=17&charset=utf8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip
          coverage: none

      - name: Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Container auflösen
        run: php bin/console lint:container

      - name: Konfiguration prüfen
        run: php bin/console lint:yaml config

      - name: Templates prüfen
        run: php bin/console lint:twig templates

      - name: Doctrine-Mapping prüfen
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Tests
        run: vendor/bin/phpunit --no-coverage
