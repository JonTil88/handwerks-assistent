# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.yaml

parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Craft\Assistant\:
        resource: '../src/'
        exclude:
            # Entities are not services.
            - '../src/Entity/'
            # Pure value objects without service character.
            - '../src/Domain/Money.php'
            - '../src/Domain/PriceSnapshot.php'
            - '../src/Ai/Answer.php'

    # The vectorizer is replaceable: locally via Ollama, later via another provider.
    Craft\Assistant\Retrieval\Vectorizer:
        alias: Craft\Assistant\Retrieval\SymfonyAiVectorizer

    Craft\Assistant\Retrieval\SymfonyAiVectorizer:
        arguments:
            $model: '%env(OLLAMA_EMBEDDING_MODEL)%'

    Craft\Assistant\Ai\ChatClient:
        arguments:
            $model: '%env(OLLAMA_LLM_MODEL)%'
